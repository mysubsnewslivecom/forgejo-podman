log:
  level: ${LOG_LEVEL}
  job_level: ${JOB_LOG_LEVEL}

runner:
  file: .runner
  capacity: ${CAPACITY}
  labels:
  labels:
    - "host:host"

  envs:
    A_TEST_ENV_NAME_1: a_test_env_value_1
    A_TEST_ENV_NAME_2: a_test_env_value_2
  # env_file: .env
  timeout: ${TIMEOUT}
  shutdown_timeout: ${SHUTDOWN_TIMEOUT}
  # Whether skip verifying the TLS certificate of the instance.
  insecure: ${INSECURE}
  # The timeout for fetching the job from the Forgejo instance.
  fetch_timeout: 30s
  # The interval for fetching the job from the Forgejo instance.
  fetch_interval: 2s
  # The interval for reporting the job status and logs to the Forgejo instance.
  report_interval: 1s

cache:
  enabled: true
  port: 0
  dir: ""
  external_server: ""
  secret: ""
  secret_url: ""
  host: ""
  proxy_port: 0
  actions_cache_url_override: ""

container:
  network: "${CONTAINER_NETWORK}"
  enable_ipv6: false
  privileged: false
  options:
  workdir_parent:
  valid_volumes: []
  docker_host: "${DOCKER_HOST}"      # "-" disables socket injection into job containers
  force_pull: false
  force_rebuild: false

host:
  workdir_parent:

server:
  connections:
    ${CONNECTION_NAME}:
      url: ${FORGEJO_URL}
      uuid: ${RUNNER_UUID}
      token: ${RUNNER_TOKEN}
